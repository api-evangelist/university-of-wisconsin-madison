- aid: university-of-wisconsin-madison:canvas-lms
  name: Canvas LMS (tenant)
  x-operator: tenant
  description: >-
    UW-Madison's learning management system runs on an Instructure Canvas tenant at canvas.wisc.edu, gated
    behind the institution's own Shibboleth IdP — an unauthenticated request 302-redirects to login.wisc.edu/idp/profile/SAML2/Redirect/SSO,
    and canvas.wisc.edu/api/v1/accounts returns Canvas's own 401 JSON. This is a REAL institutional fact
    and one of UW-Madison's largest programmable surfaces, so it is recorded — but the data is UW-Madison's
    and the contract is Instructure's. Per the operator axis, Instructure's generic Canvas API specification
    is deliberately NOT saved under this institution, and no artifact is derived from it. Any LTI conformance
    at UW-Madison lives here, inside the vendor's contract, not in anything the institution publishes.
  humanURL: https://canvas.wisc.edu/
  baseURL: https://canvas.wisc.edu/api/v1
  tags:
  - Learning Management
  - Canvas
  - Instructure
  - Tenant
  - LTI
  properties:
