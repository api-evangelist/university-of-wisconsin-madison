    x-operator: institution
    description: >-
      Live OAI-PMH 2.0 harvesting endpoint for MINDS@UW, UW-Madison's institutional repository.
      Confirmed with ?verb=Identify — repositoryName 'MINDS@UW', protocolVersion 2.0,
      adminEmail dspace-help@library.wisc.edu, records back to 1985 — and ?verb=ListMetadataFormats,
      which offers 13 prefixes (oai_dc, qdc, dim, xoai, mods, mets, didl, ore, rdf, marc, etdms,
      rioxx, uketd_dc). Classed institution rather than tenant because the endpoint reports its
      own baseURL under wisc.edu and is administered by UW-Madison Libraries; the underlying
      DSpace software is open source and self-hosted, not a vendor SaaS contract.
    humanURL: https://minds.wisc.edu/
