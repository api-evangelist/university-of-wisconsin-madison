x-coverage:
  state: covered
  reason: institution-operated-program-verified
  detail: >-
    UW-Madison is not a thin profile. Twelve machine-readable contracts were retrieved and every
    one was checked against the operator axis before being saved: all eleven portal specs
    declare servers under api.wisc.edu / mock.api.wisc.edu / doit.dev.api.wisc.edu and DoIT
    contacts, so all are x-operator institution. No vendor-attributed contract was found or
    added. Three findings limit the profile. (1) The developer portal at developer.wisc.edu is
    an Angular SPA that returns an identical 2,138-byte shell with HTTP 200 for EVERY path — a
    bogus URL and /.well-known/security.txt both return the same body — so no developer.wisc.edu
    deep link can be verified by status code; the pointers kept here were confirmed instead
    against the portal's own sitemap.xml, and the previously catalogued DARS API pointer was
    removed because it appears in neither the sitemap nor the portal's API catalog. The
    contracts themselves were recovered from the portal's own JSON API
    (/portals/api/sites/{siteId}/liveportal/apis/{apiId}/download_spec), not from the rendered
    pages. (2) Production APIs are gated: every API product carries approvalType "manual" and a
    UW NetID is required to sign in, so request/response behaviour could not be exercised —
    though UW-Madison publishes open mock variants on mock.api.wisc.edu, which is why the
    contracts are still fully readable. (3) No OpenAPI exists for the course-search API, the
    identity federation or the OAI-PMH endpoint; those were probed live and are recorded with
    method probed, never as UW-Madison publications.
  evidence:
  - url: https://developer.wisc.edu/portals/api/sites/doit-ipt-apigee-prod-ce29-productionorgportal/liveportal/apis
