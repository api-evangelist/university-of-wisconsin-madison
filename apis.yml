aid: university-of-wisconsin-madison
name: University of Wisconsin-Madison
x-type: university
x-category: Public Research University
description: >-
  The University of Wisconsin-Madison is a public land-grant research university in Madison,
  Wisconsin, and one of the very few institutions in this cohort that genuinely operates an API
  program of its own rather than pointing at a vendor's. Its Division of Information Technology
  (DoIT) runs a formal API Program on a UW-owned Google Apigee organization
  (doit-ipt-apigee-prod-ce29), fronted by a public developer portal at developer.wisc.edu, and
  publishes eleven OpenAPI 3.0 contracts — 245 operations across Person, HR, Manifest (Grouper
  groups), Finance, Locations, Enterprise Billing and OAuth — every one of them served from
  api.wisc.edu or mock.api.wisc.edu with a wisc.edu contact. Nothing in this repository is a
  vendor contract running under the institution's name: there is no Figshare, Pure, Ex Libris,
  Dataverse or Symplectic surface attributed here. Beyond the gateway, UW-Madison operates a
  fully public unauthenticated course-search API at public.enroll.wisc.edu, its own Shibboleth
  identity provider at login.wisc.edu speaking both SAML 2.0 and OpenID Connect, and a live
  OAI-PMH 2.0 endpoint for the MINDS@UW institutional repository. The honest limits: production
  access is gated behind a manual institutional approval per API product and is effectively
  closed to anyone without a UW NetID, the estate declares zero OAuth scopes, no contract
  carries a license or terms of service, and the developer portal is a client-rendered
  single-page app that returns an identical 2,138-byte shell for every URL — including ones
  that do not exist. Learning management runs on a Canvas tenant, recorded here as a tenant
  relationship and not as UW-Madison engineering.
