note: >-
  Conformance is scored against the Kin Score `education` regime standards[]. Every entry below
  is either read out of a contract UW-Madison publishes or out of a live endpoint response —
  never out of a prose claim. Standards in the regime that UW-Madison does NOT demonstrate are
