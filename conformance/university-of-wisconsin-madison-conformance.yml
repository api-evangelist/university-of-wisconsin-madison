- id: crossref
  conforms: false
  evidence: No Crossref deposit or query surface operated by UW-Madison was found.
contract_standards:
- id: openapi-3.0
  conforms: true
  evidence: >-
    All 11 published contracts are OpenAPI 3.0.x (3.0.0, 3.0.2, 3.0.4), served as YAML/JSON by
    the UW-Madison Developer Portal itself at
    /portals/api/sites/{siteId}/liveportal/apis/{apiId}/download_spec. 245 operations and 113
    component schemas in total.
- id: json-api
  conforms: partial
  evidence: >-
    The Person, Mock Person, Mock Person Certificates, HR, Mock HR, Manifest and Mock Manifest
    contracts (7 of 12) use JSON:API response envelopes — data/attributes/relationships with
    jsonapi versioning — matching the UW-Madison API Standards. The Finance, Locations,
    Enterprise Billing and OAuth contracts do not; they return plain JSON. Partial because the
    house standard is applied to the Enterprise Integration team's APIs but not the EBS/IBS ones.
- id: oauth2-client-credentials
  conforms: true
  evidence: >-
    10 of 12 contracts declare securitySchemes.OAuth2ClientCredentials with
    tokenUrl https://api.wisc.edu/oauth/token. The OAuth contract itself documents the token
    endpoint and uses HTTP Basic to present the client credentials.
- id: openid-connect
  conforms: true
  evidence: >-
    https://login.wisc.edu/.well-known/openid-configuration returns 200 application/json — a
    valid OIDC discovery document (issuer https://login.wisc.edu, authorization/token/userinfo/
    introspection endpoints under /idp/profile/oidc/, jwks_uri, end_session_endpoint,
    response_types code + id_token + hybrid, grant_types authorization_code + refresh_token,
    RS/HS/ES signing algorithms). This is campus SSO, NOT the API gateway: the API gateway has
    no discovery document (https://api.wisc.edu/.well-known/openid-configuration is 404) and
    authenticates with OAuth 2.0 client credentials only.
- id: rfc9116-security-txt
  conforms: false
  evidence: >-
    https://www.wisc.edu/.well-known/security.txt 404. developer.wisc.edu returns HTTP 200 for
    the path but serves the 2,138-byte Angular shell — a soft-404, not a security.txt.
- id: llms-txt
  conforms: false
  evidence: https://www.wisc.edu/llms.txt returns 404.
