standards:
- id: oai-pmh
  conforms: true
  evidence: >-
    MINDS@UW, UW-Madison's institutional repository, exposes a live OAI-PMH 2.0 endpoint at
    https://minds.wisc.edu/server/oai/request. Confirmed with ?verb=Identify (200,
    application/xml): repositoryName 'MINDS@UW', protocolVersion 2.0, adminEmail
    dspace-help@library.wisc.edu, earliestDatestamp 1985-01-01, granularity
    YYYY-MM-DDThh:mm:ssZ, deletedRecord transient. ?verb=ListMetadataFormats (200) returns 13
    metadata prefixes: oai_dc, qdc, dim, xoai, mods, mets, didl, ore, rdf, marc, etdms, rioxx,
    uketd_dc. The baseURL the endpoint reports for itself is on wisc.edu — the institution's own
    registrable domain — and the admin contact is library.wisc.edu, so this is institution-
    operated even though the underlying software is DSpace.
- id: shibboleth
  conforms: true
  evidence: >-
    UW-Madison runs its own Shibboleth Identity Provider. https://login.wisc.edu/idp/shibboleth
    returns 200 application/xml — a SAML 2.0 EntityDescriptor with
    entityID="https://login.wisc.edu/idp/shibboleth", an IDPSSODescriptor advertising
    protocolSupportEnumeration urn:oasis:names:tc:SAML:2.0:protocol, a shibmd:Scope of
    "wisc.edu", and signing/encryption KeyDescriptors. The /idp/ path layout and the shibmd
    extension namespace are Shibboleth-specific.
- id: saml
  conforms: true
  evidence: >-
    The same metadata document is valid SAML 2.0 metadata
    (urn:oasis:names:tc:SAML:2.0:metadata) describing an IdP with SSO endpoints. Independently
    corroborated at the service layer: https://canvas.wisc.edu/ 302-redirects unauthenticated
    users to https://login.wisc.edu/idp/profile/SAML2/Redirect/SSO, a live SAML 2.0 HTTP-Redirect
    SSO binding in production use.
- id: scim
  conforms: false
  evidence: >-
    No SCIM surface found. The identity/provisioning contracts UW-Madison publishes — Person API
    (47 operations) and Manifest API (5 operations, Grouper-backed groups) — use JSON:API
    resource envelopes and UW-local schemas, not urn:ietf:params:scim:schemas:core:2.0. No
    /scim/v2 path exists in any of the 12 contracts, and no ServiceProviderConfig,
    ResourceTypes or Schemas endpoint was found. This is the closest near-miss in the profile:
    the Person and Manifest APIs cover the same ground SCIM standardizes.
- id: lti
  conforms: false
  evidence: >-
    No LTI surface in any UW-Madison-operated contract. (A case-insensitive scan of all 12
    specs matches only substrings — "multiple", "fullTimeEquivalent", "ultimately" — and no
    LTI 1.3 / LTI Advantage endpoint, claim or launch URL.) LTI at UW-Madison lives inside the
    Canvas tenant, where the contract is Instructure's, not the institution's.
- id: oneroster
  conforms: false
  evidence: >-
    No OneRoster endpoints or /ims/oneroster paths in any contract. Roster data is exposed
    through the UW-local HR API and Manifest API instead.
- id: ed-fi
  conforms: false
  evidence: No Ed-Fi ODS/API surface found; Ed-Fi is a K-12 standard and is not expected here.
- id: caliper
  conforms: false
  evidence: No Caliper Analytics sensor or event endpoint found on any wisc.edu host.
- id: qti
  conforms: false
  evidence: No QTI assessment interchange surface found; assessment lives inside the Canvas tenant.
- id: orcid
  conforms: false
  evidence: >-
    No ORCID iD field appears in any published contract. The Person API's identifier set is
