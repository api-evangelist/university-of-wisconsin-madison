- date: '2026-08-19'
  rating: 4
  summary: 'University pipeline re-profile with the operator axis applied. UW-Madison is the rare case
    in this cohort where the institution genuinely operates its own API program: I recovered eleven OpenAPI
    3.0 contracts (245 operations, 113 component schemas) from the developer portal''s own catalog API
    at /portals/api/sites/{siteId}/liveportal/apis/{apiId}/download_spec, and every one declares servers
    under api.wisc.edu, mock.api.wisc.edu or doit.dev.api.wisc.edu with a wisc.edu contact — x-operator
    institution on all of them. No Figshare, Pure, Ex Libris, Dataverse or Symplectic contract is attributed
    here, so the misattribution this pipeline exists to prevent does not occur in this repo. Three surfaces
    were added that no prior pass had found: a fully public unauthenticated course-search API at public.enroll.wisc.edu,
    an institution-operated Shibboleth IdP at login.wisc.edu serving both SAML 2.0 metadata and OIDC discovery,
    and a live OAI-PMH 2.0 endpoint for MINDS@UW. One tenant relationship is recorded rather than credited:
    Canvas LMS at canvas.wisc.edu, gated behind UW''s own IdP — the data is UW''s, the contract is Instructure''s,
    and Instructure''s spec is deliberately not saved here. CORRECTION to the 2026-06-03 review: the DARS
    API entry has been REMOVED. That review recorded https://developer.wisc.edu/docs/dars/1/types/DarsBatchAuditRequest
    as HTTP 200, but developer.wisc.edu is an Angular SPA that returns a byte-identical 2,138-byte shell
    with status 200 for every URL including deliberately bogus ones; DARS appears in neither the portal
    sitemap nor its API catalog. The Curricular Data Model pointer was re-verified as real and retained,
    and the SourceCode/Authentication pointers were moved off the now-archived api-program repository
    to the live api-publisher-documentation repository.'
