  /validateFdm:
    post:
      description: Validates a set of FDM combinations for compatibility
      requestBody:
        content:
          application/json:
            schema:
              properties:
                data:
                  items:
                    properties:
                      attributes:
                        properties:
                          activity:
                            example: AC000001
                            type: string
                          company:
                            example: UWRVF
                            type: string
                          costCenter:
                            example: CC00000123
                            type: string
                          function:
                            example: FN0100
                            type: string
                          fund:
                            example: FD0101
                            type: string
                          gift:
                            example: GF00000000001
                            type: string
                          grant:
                            example: GR00000000001
                            type: string
                          ledgerAccount:
                            example: '6015'
                            type: string
                          program:
                            example: PG000000001
                            type: string
                          project:
                            example: PJ000000001
                            type: string
                          revenueCategory:
                            example: RC00001
                            type: string
                          spendCategory:
                            example: SC00001
                            type: string
                        required:
                        - company
                        type: object
                      id:
                        description: Users can assign a unique ID to each combo, and it will be included in the results.
                        example: '1'
                        type: string
                      type:
                        enum:
                        - fdmCombos
                        example: fdmCombos
                        type: string
                    required:
                    - type
                    - id
                    - attributes
                    type: object
                  type: array
              type: object
        description: FDM data to be validated in JSON format, up to 1000 combos
        required: true
      responses:
        '200':
          content:
            application/vnd.api+json:
              example:
                data:
                - attributes:
                    errors:
                    - errorCode: FDM307
                      message: Fund FD0101 is not allowed on gift GF000000002 (valid value is FD0233)
                    valid: false
                  id: '1'
                  type: fdmComboValidationResults
              schema:
                properties:
                  data:
                    items:
                      properties:
                        attributes:
                          properties:
                            errors:
                              items:
                                properties:
                                  errorCode:
                                    description: A machine readable code for the error encountered
                                    example: FDM307
                                    type: string
                                  message:
                                    description: A human readable description of the error
                                    example: Fund FD0101 is not allowed on gift GF000000002 (valid value is FD0233)
                                    type: string
                                type: object
                              type: array
                            valid:
                              description: Whether or not this combo was valid
                              example: false
                              type: boolean
                          type: object
                        id:
                          description: The ID of the combo, if supplied in the input
                          example: '1'
                          type:
                          - string
                          - 'null'
                        type:
                          example: fdmComboValidationResults
                          type: string
                      type: object
                    type: array
                type: object
          description: OK.  Validation completed successfully.  Your response will contain errors if any were detected. Line validation results are sent back in the same ordering as they were submitted.
