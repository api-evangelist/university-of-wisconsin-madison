  /awardLines:
    get:
      description: Retrieves a paginated listing of all award lines from the accounting system
      parameters:
      - description: The datetime that the record was last changed in the Finance API's database.
        in: query
        name: filter[lastModified]
        required: false
        schema:
          format: datetime
          type: string
      - description: Page offset of records included in the response
        in: query
        name: page[number]
        required: false
        schema:
          minimum: 1
          type: integer
      - description: Number of records included in the response
        in: query
        name: page[size]
        required: false
        schema:
          maximum: 1000
          minimum: 1
          type: integer
      - in: query
        name: filter[awardId]
        required: false
        schema:
          type: string
      - in: query
        name: filter[name]
        required: false
        schema:
          type: string
      - in: query
        name: filter[grantId]
        required: false
        schema:
          type: string
      - in: query
        name: filter[fromDate]
        required: false
        schema:
          format: date
          type: string
      - in: query
        name: filter[toDate]
        required: false
        schema:
          format: date
          type: string
      - in: query
        name: filter[costCenterId]
        required: false
        schema:
          type: string
      - in: query
        name: filter[revenueCategoryId]
        schema:
          type: string
      - in: query
        name: filter[fundId]
        schema:
          type: string
      - in: query
        name: filter[functionId]
        schema:
          type: string
      responses:
        '200':
          content:
            application/vnd.api+json:
              example:
                data:
                - attributes:
                    allocationProfileId: UWMSN_Federal
                    allocationProfileName: UWMSN - Federal
                    awardId: AWARD_CONTRACT-6-9854
                    basisType: Modified Total Direct Costs
                    billingScheduleId: BILLING_SCHEDULE-6-11038
                    costCenterId: CC002851
                    costRateTypeId: UWMSN_MTDC_On_Campus_Research
                    costRateTypeName: On Campus Research
                    currentAmount: 155500
                    facilitiesAdminRate: 0.555
                    fromDate: 2024-04-01
                    functionId: FN0400
                    fundId: FD0144
                    grantId: GRTEST00002
                    lifecycleStatus: Open
                    name: AWD-900001 RC00037 - Federal Grants & Contracts (Sponsored Research) (Line 1)
                    rateAgreementId: UWMSN_MTDC_Federal_Rate_Agreement
                    rateAgreementName: UWMSN - MTDC - Federal Rate Agreement (04/01/2022)
                    revenueCategoryId: RC00037
                    salaryCap: National Institute of Health Salary Cap
                    spendRestriction: Subawards Only
                    status: Active
                    toDate: 2029-03-31
                    type: Cost Reimbursable
                  id: AWD-005399_GR000040574
                  links:
                    self: https://api.wisc.edu/finance/awardLines/AWD-005399_GR000040574
                  meta:
                    lastModified: 2026-06-15 13:11:13
                  type: awardLines
                links:
                  first: https://api.wisc.edu/finance/awardLines?page[first]=1
                  last: https://api.wisc.edu/finance/awardLines?page[last]=99
                  next: https://api.wisc.edu/finance/awardLines?page[next]=2
                  prev: https://api.wisc.edu/finance/awardLines?page[prev]=1
                  self: https://api.wisc.edu/finance/awardLines
                meta:
                  pageNumber: 1
                  pageSize: 100
                  totalCount: 1234
                  totalPages: 13
              schema:
                oneOf:
                - properties:
                    data:
                      description: A collection of award lines.
                      items:
                        description: A single award line record.
                        properties:
                          attributes:
                            properties:
                              allocationProfileId:
                                description: Allocation Profile Name of the Award Line
                                example: UWMSN_Federal
                                type: string
                              allocationProfileName:
                                description: Allocation Profile ID of the Award Line
                                example: UWMSN - Federal
                                type: string
                              awardId:
                                description: ID of the Award Line
                                example: AWARD_CONTRACT-6-9854
                                type: string
                              basisType:
                                description: Basis Type of the Award Line
                                example: Modified Total Direct Costs
                                type: string
                              billingScheduleId:
                                description: Billing Schedule ID of the Award Line
                                example: BILLING_SCHEDULE-6-11038
                                type: string
                              costCenterId:
                                description: Cost Center ID of the Award Line
                                example: CC002851
                                type: string
                              costRateTypeId:
                                description: Cost Rate Type ID of the Award Line
                                example: UWMSN_MTDC_On_Campus_Research
                                type: string
                              costRateTypeName:
                                description: Cost Rate Type Name of the Award Line
                                example: On Campus Research
                                type: string
                              currentAmount:
                                description: Current Amount of the Award Line
                                example: 155500
                                format: double
                                type: number
                              facilitiesAdminRate:
                                description: Facilities Admin Rate of the Award Line
                                example: 0.555
                                type: number
                              fromDate:
                                description: From Date of the Award Line
                                example: 2024-04-01
                                type: string
                              functionId:
                                description: Function ID of the Award Line
