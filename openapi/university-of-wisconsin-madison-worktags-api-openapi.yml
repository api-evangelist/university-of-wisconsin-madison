                                type: string
                              name:
                                description: Name of the Award Line
                                example: AWD-900001 RC00037 - Federal Grants & Contracts (Sponsored Research) (Line 1)
                                type: string
                              rateAgreementId:
                                description: Rate Agreement ID of the Award Line
                                example: UWMSN_MTDC_Federal_Rate_Agreement
                                type: string
                              rateAgreementName:
                                description: Rate Agreement Name of the Award Line
                                example: UWMSN - MTDC - Federal Rate Agreement (04/01/2022)
                                type: string
                              revenueCategoryId:
                                description: Revenue Category ID of the Award Line
                                example: RC00037
                                type: string
                              salaryCap:
                                description: Salary Cap of the Award Line
                                example: National Institute of Health Salary Cap
