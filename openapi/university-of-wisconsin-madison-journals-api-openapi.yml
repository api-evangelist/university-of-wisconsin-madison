                          status:
                            description: Current status of the search job
                            example: FINISHED
                            type: string
                        type: object
                      id:
                        description: Query execution ID
                        example: 12345678-1234-987654321
                        type: string
                      type:
                        description: Type of response. Always equal to 'journalsSearchStatus'
                        example: journalsSearchStatus
                        type: string
                    type: object
