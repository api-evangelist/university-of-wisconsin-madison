  /journals/search/status/{id}:
    get:
      description: Retrieves the status of a previously requested search of journal records.
      parameters:
      - description: A journal search ID passed in as a URL parameter.
        in: path
        name: id
        required: true
        schema:
          description: The unique identifier for a search of journals.
          example: 12345678-1234-987654321
          type: string
      responses:
        '200':
          content:
            application/vnd.api+json:
              example:
                data:
                  attributes:
                    details: null
                    status: FINISHED
                  id: 12345678-1234-987654321
                  type: journalsSearchStatus
              schema:
                properties:
                  data:
                    properties:
                      attributes:
                        properties:
                          details:
