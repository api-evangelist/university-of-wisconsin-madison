  /assets/{id}:
    get:
      description: Retrieves a asset by its ID.
      parameters:
      - description: An asset ID passed in as a URL parameter.
        in: path
        name: id
        required: true
        schema:
          description: The unique identifier for an asset record generated by Workday.
          example: BAS-01234567
          type: string
      - description: Delivery mode for the response. When set to 'bulk', the API will save the response to S3 and return a link to download it instead of returning the data directly. Cannot be used with pagination parameters.
        examples:
          bulk:
            description: Returns a link to download data from S3
            summary: Bulk delivery mode
            value: bulk
          pagination:
            description: Returns data with pagination support
            summary: Pagination delivery mode
            value: pagination
        in: query
        name: delivery
        schema:
          default: pagination
          enum:
          - pagination
          - bulk
          type: string
