                                      example: 3816.06
                                      format: double
                                      type: number
                                    shareClass:
                                      description: The asset class associated with the share.
                                      example: Athletic Recreational Equipment
                                      type:
                                      - string
                                      - 'null'
                                    shareType:
                                      description: The asset classification associated with the share.
                                      example: Capital Equipment
                                      type:
                                      - string
                                      - 'null'
