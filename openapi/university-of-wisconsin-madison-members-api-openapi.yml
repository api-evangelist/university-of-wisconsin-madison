  /members/{id}/groups:
    get:
      description: Get the groups a member belongs to.
      summary: Get a member's groups.
      operationId: get_member_groups
      tags:
      - members
      parameters:
      - name: id
        description: ID of a member.
        in: path
        example: f8c6bf65-1992-4017-b7de-ee3b9f1f0abc
        required: true
        schema:
          type: string
          description: Manifest ID for the person/member.
      - name: page[number]
        description: The page number to retrieve. Defaults to 1.
        in: query
        required: false
        example: 1
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: page[size]
        description: The number of results per page. Defaults to the maximum page size. Must not exceed the configured maximum (default 100).
        in: query
        required: false
        example: 10
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
      responses:
        '200':
          description: The groups for a member
          content:
            application/vnd.api+json:
              schema:
                type: object
                required:
                - data
                - links
                properties:
                  data:
                    description: A collection of groups
                    type: array
                    items:
                      description: Manifest group.
                      type: object
                      required:
                      - type
                      - id
                      - attributes
                      - links
                      properties:
                        type:
                          type: string
                          example: groups
                        id:
                          type: string
                          description: ID of the Manifest group.
                        attributes:
                          type: object
                          required:
                          - path
                          properties:
                            path:
                              description: Group name.
                              type: string
                              example: uw:org:my:group:name
                            description:
                              description: Group description.
                              type: string
                              example: A sample group
                        links:
                          description: The link to access a resource itself
                          type: object
                          properties:
                            self:
                              type: string
                              example: https://api.wisc.edu/link/to/self
                  links:
                    description: Pagination links for a paginated collection.
                    type: object
                    required:
                    - self
                    properties:
                      self:
                        type: string
                        description: Link to the current page.
                        example: https://api.wisc.edu/manifest/groups/uw:org:my:group/members?page%5Bnumber%5D=2&page%5Bsize%5D=10
                      next:
                        type: string
                        description: Link to the next page. Only present when there are more results.
                        example: https://api.wisc.edu/manifest/groups/uw:org:my:group/members?page%5Bnumber%5D=3&page%5Bsize%5D=10
                      prev:
                        type: string
                        description: Link to the previous page. Only present when the current page is greater than 1.
                        example: https://api.wisc.edu/manifest/groups/uw:org:my:group/members?page%5Bnumber%5D=1&page%5Bsize%5D=10
              examples:
                example-member-groups:
                  value:
                    data:
                    - attributes:
                        path: uw:org:my:group
                        description: A sample group
                      id: uw:org:my:group
                      links:
                        self: https://api.wisc.edu/manifest/groups/uw:org:my:group
                      type: groups
                    links:
                      self: https://api.wisc.edu/manifest/members/26b8827a-f050-4558-baea-0fffa88fcde0/groups?page%5Bnumber%5D=1&page%5Bsize%5D=10
                      next: https://api.wisc.edu/manifest/members/26b8827a-f050-4558-baea-0fffa88fcde0/groups?page%5Bnumber%5D=2&page%5Bsize%5D=10
