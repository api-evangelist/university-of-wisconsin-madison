openapi: 3.2.0
info:
  title: Mock Person Webhooks API
  version: 1.0.0
  contact:
    name: DoIT Enterprise Integration API Team
    email: api@doit.wisc.edu
    url: https://go.wisc.edu/k701y6
  description: A mock implementation of the Person API.
servers:
- url: https://mock.api.wisc.edu
security:
- OAuth2ClientCredentials: []
tags:
- name: Webhooks
paths:
  /people/webhooks:
    get:
      description: Get a collection of webhooks. Refer to the Webhooks Documentation for more information, including detailed descriptions of the metrics.
      summary: Get webhooks
      operationId: get_webhooks
      tags:
      - Webhooks
      responses:
        '200':
          description: A collection of webhooks.
          content:
            application/vnd.api+json:
              schema:
                type: object
                required:
                - data
                - links
                properties:
                  data:
                    description: A collection of webhooks.
                    type: array
                    items:
                      description: A webhook represents the configuration for an application to subscribe to events from the Person API. Webhook events are HTTP requests that will be sent to a server when data changes about a person. Refer to the [Webhooks Documentation](https://kb.wisc.edu/uw-apis/158498) for more information, including detailed descriptions of the metrics.
                      type: object
                      required:
                      - type
                      - id
                      - attributes
                      - links
                      - relationships
                      properties:
                        type:
                          type: string
                          example: webhooks
                        id:
                          type: string
                          description: An identifier used to identify non-person resources, such as Certificates and Webhooks. This ID is used for following other links returned in the API response. Concatenating parts of the URL to form a link is discouraged. Instead, use the fully-formed links returned in an API response.
                        attributes:
                          type: object
                          required:
                          - url
                          - expired
                          properties:
                            url:
                              type: string
                              format: url
                              example: https://department.wisc.edu/person-api-webhook
                              description: URL that accepts Person API webhook events. This URL must use HTTPS.
                            token:
                              type: string
                              readOnly: true
                              description: A secret token sent with each webhook event. A server must verify this token when receiving a webhook from the Person API to ensure it is authenticate. This token is only returned when creating a webhook and cannot be set by the client. It cannot be retrieved again in future requests.
                            expired:
                              type: boolean
                              readOnly: false
                              description: Indicates whether the webhook subscription has expired. This value can be set to false to un-expire a webhook but can not be set to true to expire it.
                            relationships:
                              type: array
                              readOnly: false
                              description: The relationships to insert into the `included` section of webhook events.
                              default:
                              - identifiers
                              items:
                                type: string
                                enum:
                                - identifiers
                                - pastIdentifiers
                            advancedFilter:
                              type:
                              - string
                              - 'null'
                              example: jobs(equals(current, true))
                              description: Advanced filter to apply to webhook events. When set, only events matching this filter will be delivered. This field is mutually exclusive with webhook filters (webhookFilters). For more information see [Advanced Filter](https://kb.wisc.edu/uw-apis/158404#advanced-filters).
                            ackedInPastWeek:
                              type: number
                              readOnly: true
                              description: 'Metric: The total number of message acknowledgements within the last 7 days.'
                              example: 5000
                            deadlineExceededInPastWeek:
                              type: number
                              readOnly: true
                              description: 'Metric: The total number of messages which were not acknowledged before timing out within the last 7 days.'
                              example: 35
                            oldestUnackedMessageAge:
                              type: number
                              readOnly: true
                              description: 'Metric: The age (in seconds) of the oldest unacknowledged message currently in your subscription.'
                              example: 6500
                            4xxResponsesInPastWeek:
                              type: number
                              readOnly: true
                              description: 'Metric: The total number of HTTP 4xx responses to delivery attempts within the last 7 days.'
                              example: 20
                            5xxResponsesInPastWeek:
                              type: number
                              readOnly: true
                              description: 'Metric: The total number of HTTP 5xx responses to delivery attempts within the last 7 days.'
                              example: 10
                        links:
                          description: The link to access a resource itself
                          type: object
                          properties:
                            self:
                              type: string
                              example: https://api.wisc.edu/link/to/self
                        relationships:
                          type: object
                          required:
                          - replay
                          - webhookFilters
                          - webhookRelationshipFilters
                          properties:
                            replay:
                              description: A generic relationship object
                              type: object
                              properties:
                                links:
                                  type: object
                                  properties:
                                    related:
                                      type: string
                                      example: https://api.wisc.edu/link/to/related/object
                                data:
                                  type:
                                  - object
                                  - 'null'
                                  properties:
                                    type:
                                      type: string
                                      example: sampleType
                                    id:
                                      type: string
                                      example: sampleId
                            webhookFilters:
                              description: A generic relationship object
                              type: object
                              properties:
                                links:
                                  type: object
                                  properties:
                                    related:
                                      type: string
                                      example: https://api.wisc.edu/link/to/related/object
                                data:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      type:
                                        type: string
                                        example: sampleType
                                      id:
                                        type: string
                                        example: sampleId
                            webhookRelationshipFilters:
                              description: A generic relationship object
                              type: object
                              properties:
                                links:
                                  type: object
                                  properties:
                                    related:
                                      type: string
                                      example: https://api.wisc.edu/link/to/related/object
                                data:
