                      links:
                        self: https://api.wisc.edu/people/webhooks/2b1b6b19-7ab1-47f5-a9ce-ae0c754411f4
                      type: webhooks
                      relationships:
                        replay:
                          links:
                            related: https://api.wisc.edu/people/webhooks/2b1b6b19-7ab1-47f5-a9ce-ae0c754411f4/replay
