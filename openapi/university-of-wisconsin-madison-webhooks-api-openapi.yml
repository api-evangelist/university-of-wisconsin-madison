                                        type: string
                                        example: sampleType
                                      id:
                                        type: string
                                        example: sampleId
                  links:
                    description: The link to access a resource itself
                    type: object
                    properties:
                      self:
                        type: string
                        example: https://api.wisc.edu/link/to/self
              examples:
                example-webhooks:
                  value:
                    data:
                    - attributes:
                        url: https://department.wisc.edu/person-api-webhook
                        expired: false
                        relationships:
                        - identifiers
                        - pastIdentifiers
                        ackedInPastWeek: 3000
                        deadlineExceededInPastWeek: 40
                        oldestUnackedMessageAge: 4500
                        4xxResponsesInPastWeek: 20
                        5xxResponsesInPastWeek: 10
