                                    id:
                                      type: string
                                      example: sampleId
                  links:
                    description: The link to access a resource itself
                    type: object
                    properties:
                      self:
                        type: string
                        example: https://api.wisc.edu/link/to/self
              examples:
                example-names:
                  value:
                    data:
                    - attributes:
                        firstName: Amy
                        middleName: Marie
                        lastName: Smith
                        prefix: null
                        suffix: null
                        nameType: nameInUse
                        source: profile
                        institution: UW-Madison
                        active: true
                      id: 1cf9cd91-3c90-48c4-b0b6-0aeb446edf81
                      relationships:
