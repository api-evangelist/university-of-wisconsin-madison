          type:
          - string
          - 'null'
      responses:
        '200':
          description: A collection of names.
          content:
            application/vnd.api+json:
              schema:
                type: object
                required:
                - data
                - links
                properties:
                  data:
                    description: A collection of names
                    type: array
                    items:
                      description: Details about a name used to refer to a person.
                      type: object
                      required:
                      - type
                      - id
                      - attributes
                      - links
                      - relationships
                      properties:
                        type:
                          type: string
                          example: names
                        id:
                          type: string
                          description: Ephemeral ID used to adhere to the JSON:API specification. This ID should not be stored.
                        attributes:
                          type: object
                          required:
                          - firstName
                          - middleName
                          - lastName
                          - prefix
                          - suffix
                          - nameType
                          - source
                          - institution
                          properties:
                            firstName:
                              description: A first name for this person.
                              type: string
                              example: Amy
                              minLength: 1
                            middleName:
                              description: A middle name for this person.
                              type:
                              - string
                              - 'null'
                              example: Marie
                            lastName:
                              description: A last name for this person.
                              type:
                              - string
                              - 'null'
                              example: Smith
                            prefix:
                              description: A prefix for this person.  Cannot be set for `nameType` of `nameInUse`.
                              type:
                              - string
                              - 'null'
                              pattern: ^[A-Za-z '.-]*$
                              example: Dr
                            suffix:
                              description: A suffix for this person.  Cannot be set for `nameType` of `nameInUse`.
                              type:
                              - string
                              - 'null'
                              pattern: ^[A-Za-z '.-]*$
                              example: II
                            nameType:
                              description: The type of name for the person.
                              type: string
                              enum:
                              - nameInUse
                              - primary
                              - preferred
                              - formattedPrimary
                              example: nameInUse
                            source:
                              description: The source of a name resource.
                              type: string
                              enum:
                              - profile
                              - IAM
                              - SIS
                              - Workday
