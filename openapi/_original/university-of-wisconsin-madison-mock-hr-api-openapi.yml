    get:
      description: "Get a list of standard job descriptions."
      summary: "Get a list of standard job descriptions."
      operationId: "get_job_descriptions"
      tags:
      - "Standard Job Descriptions"
      parameters:
      - name: "page"
        in: "query"
        description: "Define options for pagination of responses. For example, `page[number]`\
          \ parameter (example: `page[number]=4`). The `page[number]` determines the\
          \ page to display. The size of the page is a constant of 100."
        required: false
        style: "deepObject"
        explode: true
        schema:
          type: "object"
          properties:
            number:
              type: "integer"
              example: 5
              default: 1
              description: "The page number to display."
      - name: "include"
        in: "query"
        description: "[include related resources](https://jsonapi.org/format/#fetching-includes).\
          \ The resources to include need to be direct relationships. For example,\
          \ `include=allSubordinateOrganizations`."
        schema:
          type: "string"
      - name: "filter"
        in: "query"
        description: "Filter results of query using the [filter query parameter family](https://jsonapi.org/recommendations/#filtering).\
          \ Refer to the [HR API Documentation](https://kb.wisc.edu/uw-apis/158637)\
          \ for more information about the `filter` query param."
        required: false
        style: "deepObject"
        explode: true
        schema:
          type: "object"
          additionalProperties: false
          properties:
            attribute:
              type: "string"
              example: "name"
      responses:
        "200":
          description: "A collection of standard job descriptions."
          content:
            application/vnd.api+json:
              schema:
                type: "object"
                required:
                - "data"
                - "links"
                - "meta"
                properties:
                  data:
                    description: "A collection of standard job descriptions."
                    type: "array"
                    items:
                      description: "A job description."
                      type: "object"
                      properties:
                        type:
                          type: "string"
                          example: "jobDescriptions"
                        id:
                          type: "string"
                          description: "The Job Code which uniquely identifies a job\
                            \ description."
                          example: "AD001"
                        attributes:
                          type: "object"
                          properties:
                            title:
                              type: "string"
                              example: "Administrative Assistant I"
                              description: "The job title."
                            group:
                              type: "string"
                              example: "Administration Group"
                              description: "The job group."
                            subGroup:
                              type: "string"
                              example: "Administrative Services"
                              description: "The job sub-group."
                            summary:
                              type: "string"
                              example: "Provides administrative support to a department\
                                \ or group of professionals in support of unit goals\
                                \ under direct supervision."
                              description: "Brief statement explaining the primary\
                                \ function of this job."
                            education:
                              type: "string"
                              example: "High School Diploma"
                              description: "Preferred education level for this job."
                            responsibilities:
                              type: "array"
                              items:
                                type: "string"
                              example:
                              - "Schedules logistics and secures resources for meetings,\
                                \ conferences, travel, and work unit operations."
                              - "Sends, receives, copies, and distributes communications\
                                \ to the appropriate entities according to established\
                                \ policies and procedures."
                              - "Serves as first point of contact for individuals\
                                \ and groups providing basic organizational information\
                                \ via phone, in person, and through other communication\
                                \ mediums, routing more complex inquiries to the appropriate\
                                \ entities."
                              - "Tracks, stocks, orders, and inventories office supplies\
                                \ to ensure adequate materials are available for workplace\
                                \ operation."
                              description: "Job responsibilities for this job."
                            fairLaborStandardsActStatus:
                              type: "boolean"
                              example: false
                              description: "The Fair Labor Standards Act status for\
                                \ this job description. If true, positions for this\
                                \ job description are exempt from certain FLSA provisions,\
                                \ namely overtime pay. If false, they are non-exempt.\
                                \ For more information on FLSA exemptions and exemption\
                                \ requirements, see: [Fair Labor Standards Act (FLSA)\
                                \ | Human Resources | UW–Madison](https://hr.wisc.edu/flsa/)\
