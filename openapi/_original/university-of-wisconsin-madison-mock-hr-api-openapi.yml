  /supervisoryOrganizations:
    get:
      description: "Get a list of supervisory organizations. For more information\
        \ on supervisory organizations, see this page: [https://secure.atp.wisconsin.edu/udds-guidance-ancillary-systems/](https://secure.atp.wisconsin.edu/udds-guidance-ancillary-systems/)"
      summary: "Get a list of supervisory organizations."
      operationId: "get_sup_orgs"
      tags:
      - "Supervisory Organizations"
      parameters:
      - name: "page"
        in: "query"
        description: "Define options for pagination of responses. For example, `page[number]`\
          \ parameter (example: `page[number]=4`). The `page[number]` determines the\
          \ page to display. The size of the page is a constant of 100."
        required: false
        style: "deepObject"
        explode: true
        schema:
          type: "object"
          properties:
            number:
              type: "integer"
              example: 5
              default: 1
              description: "The page number to display."
      - name: "filter"
        in: "query"
        description: "Filter results of query using the [filter query parameter family](https://jsonapi.org/recommendations/#filtering).\
          \ Refer to the [HR API Documentation](https://kb.wisc.edu/uw-apis/158637)\
          \ for more information about the `filter` query param."
        required: false
        style: "deepObject"
        explode: true
        schema:
          type: "object"
          additionalProperties: false
          properties:
            attribute:
              type: "string"
              example: "name"
      responses:
        "200":
          description: "A collection of supervisory organizations."
          content:
            application/vnd.api+json:
              schema:
                type: "object"
                required:
                - "data"
                - "links"
                - "meta"
                properties:
                  data:
                    description: "A collection of supervisory organizations."
                    type: "array"
                    items:
                      description: "A supervisory organization."
                      type: "object"
                      properties:
                        type:
                          type: "string"
                          example: "supervisoryOrganizations"
                        id:
                          type: "string"
                          description: "The supervisory organization ID."
                          example: "SO00002793"
                        attributes:
                          type: "object"
                          properties:
                            code:
                              type: "string"
                              example: "UWMSN | DoIT |"
                              description: "The code that precedes the name of a supervisory\
                                \ organization."
                              nullable: true
                            managerPositionId:
                              type: "string"
                              example: "0123456789"
                              description: "The Workday position ID that manages the\
                                \ supervisory organization. This is present whether\
                                \ or not the position is currently filled."
                              nullable: true
                            name:
                              type: "string"
                              example: "AIS Enterprise Integration (EI)"
                              description: "The name of the supervisory organization."
                            supervisoryOrganizationType:
                              type: "string"
                              example: "Division"
                              enum:
                              - "System"
                              - "Institution"
                              - "Executive"
                              - "Division"
                              - "College"
                              - "School"
                              - "Department"
                              - "Subdepartment"
                              description: "The type of supervisory organization."
                            costCenterId:
                              type: "string"
                              example: "CC000001"
                              description: "The ID of the default Cost Center for\
                                \ this supervisory organization."
